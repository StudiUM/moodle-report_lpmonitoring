name: Moodle plugin CI

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    # jquery.dataTables.js is third-party and is intentionally excluded from ESLint.
    # The shared workflow must avoid reporting ignored files as lint warnings.
    uses: StudiUM/common-workflows/.github/workflows/moodle-plugin-ci-template.yml@main
    with:
      moodle-branches: '["MOODLE_501_STABLE"]'
      php-versions: '["8.4", "8.3"]'
      databases: '["mariadb"]'
      # Allow the single warning for the ignored third-party DataTables file.
      max-grunt-lint-warnings: 1
      # The behat tets doesn't work on the GHA pipeline but it works on the local docker environment.
      # Lot of patched were applied to the behat tests to make them work on the GHA pipeline but it still fails. So we disable it for now.
      # Let's see if we can improve the behat test during the jquery migration.
      run-behat: false
      # Only necessary for the behat tests, which are disabled for now.
      #dependent-plugins: |
      #  --branch main StudiUM/moodle-tool_cmcompetency
      #  --branch main StudiUM/moodle-report_cmcompetency

